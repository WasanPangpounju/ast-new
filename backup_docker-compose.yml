version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: ast_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ast_new
    ports:
      - "5432:5432"
    volumes:
      - ast_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
volumes:
  ast_postgres_data:
