version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: ast_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ast_new
    ports:
      - "5432:5432"
    volumes:
      - ast_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/ast_new
    command: sh -c "npm install && npx prisma migrate deploy && npx prisma generate"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  ast_postgres_data:
